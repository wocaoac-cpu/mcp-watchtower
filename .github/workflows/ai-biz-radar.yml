name: AI Biz Radar

# 每小时跑一次（UTC，off-minute 错峰）。也可在 Actions 页面手动 "Run workflow" 立即测试。
# Gemini 免费档约 1500 次/天，每小时一轮（每轮约 2-3 次调用）绰绰有余。
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# 允许把去重历史 commit 回仓库。
permissions:
  contents: write

# 避免上一轮还没跑完又触发下一轮。
concurrency:
  group: ai-biz-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 可选调参（默认值见 radar.mjs 顶部注释）
          IDEAS_PER_RUN: "3"
          CANDIDATE_POOL: "6"
          MIN_CONFIDENCE: "0.5"
          # GEMINI_MODEL: gemini-2.5-flash
          # OUTPUT_LANG: 中文
          # VERIFY_SOURCES: "1"
        run: node tools/ai-biz-radar/radar.mjs

      - name: Commit history & archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/ai-biz-radar/history.json tools/ai-biz-radar/archive.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar): update history & archive"
            git push
          else
            echo "无变化，跳过提交"
          fi
